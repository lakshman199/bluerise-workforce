server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The bundle is same-origin with the API in a deployed environment, which is why
    # environment.production.ts uses a relative /api/v1 base rather than a baked-in
    # hostname.
    location /api/ {
        proxy_pass http://api:4300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Hashed filenames are immutable by construction, so they can be cached indefinitely.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|webp|avif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The entry document must never be cached, or a deploy leaves browsers requesting
    # hashed assets that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Client-side routing: unknown paths are handled by the Angular router, which renders
    # the 404 page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
