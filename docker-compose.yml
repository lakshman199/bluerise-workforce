name: bluerise-workforce

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bluerise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bluerise_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-bluerise_dev}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The API waits on this rather than on the container merely existing, so it does not
      # start migrating against a database that is still initialising.
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-bluerise} -d ${POSTGRES_DB:-bluerise_dev}',
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      API_PORT: '4300'
      API_HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-bluerise}:${POSTGRES_PASSWORD:-bluerise_dev_password}@postgres:5432/${POSTGRES_DB:-bluerise_dev}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4310}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4310}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PRETTY: ${LOG_PRETTY:-false}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
    ports:
      - '${API_PORT:-4300}:4300'

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-4310}:8080'

volumes:
  postgres-data:
