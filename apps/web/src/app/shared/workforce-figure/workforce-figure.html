<figure class="figure">
  <div
    class="figure__frame"
    [style.aspect-ratio]="ratio()"
    [style.--object-position]="image().objectPosition"
  >
    @for (epoch of [loadEpoch()]; track epoch) {
      <img
        class="figure__img"
        [class.figure__img--failed]="failed()"
        [src]="image().src"
        [alt]="image().alt"
        [attr.width]="image().width"
        [attr.height]="image().height"
        [attr.loading]="eager() ? 'eager' : 'lazy'"
        decoding="async"
        (error)="onImageError()"
        (load)="onImageLoad()"
      />
    }
  </div>
  @if (caption(); as captionText) {
    <figcaption>{{ captionText }}</figcaption>
  }
</figure>
