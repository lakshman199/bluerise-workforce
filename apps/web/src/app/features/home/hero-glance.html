<section
  class="hero-glance"
  [class.hero-glance--visible]="visible()"
  aria-labelledby="glance-heading"
>
  <h2 class="glance-heading" id="glance-heading">
    <span class="glance-heading__float">
      <span class="glance-heading__lead">{{ headlineLead }}</span>
      <span class="glance-heading__accent">
        {{ headlineAccent }}
        <span class="glance-heading__stroke" aria-hidden="true"></span>
      </span>
    </span>
  </h2>

  <ul class="glance-cards">
    @for (card of cards; track card.id) {
      <li class="glance-cards__item">
        <a
          class="glance-card"
          [class.glance-card--hire]="card.id === 'hire'"
          [class.glance-card--operations]="card.id === 'operations'"
          [class.glance-card--support]="card.id === 'support'"
          [routerLink]="card.href"
        >
          <span class="glance-card__lift">
            <span class="glance-card__float">
              <span class="glance-card__icon" aria-hidden="true">
                @switch (card.icon) {
                  @case ('people') {
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                      <circle cx="9" cy="8" r="3" />
                      <path d="M4 19c.5-2.6 2.4-4 5-4s4.5 1.4 5 4" stroke-linecap="round" />
                      <path d="M17 8v6M14 11h6" stroke-linecap="round" />
                    </svg>
                  }
                  @case ('workforce') {
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                      <rect x="4" y="5" width="16" height="15" rx="2.2" />
                      <path d="M8 3.5v3M16 3.5v3M4 10h16" stroke-linecap="round" />
                      <circle cx="12" cy="15.2" r="2.2" />
                      <path d="M12 14.2v1.6l1.1.7" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                  }
                  @case ('headset') {
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                      <path d="M5.5 11.5V10a6.5 6.5 0 0 1 13 0v1.5" stroke-linecap="round" />
                      <rect x="3.8" y="11" width="4.2" height="6.2" rx="1.6" />
                      <rect x="16" y="11" width="4.2" height="6.2" rx="1.6" />
                      <path d="M18.1 17.2c0 2.1-1.8 3.3-4.1 3.3" stroke-linecap="round" />
                    </svg>
                  }
                }
              </span>
              <h3 class="glance-card__title">{{ card.title }}</h3>
              <p class="glance-card__body">{{ card.body }}</p>
              <span class="glance-card__arrow" aria-hidden="true">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7">
                  <path d="M3.2 8h9.6M9.2 4.4 12.8 8 9.2 11.6" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </span>
            </span>
          </span>
        </a>
      </li>
    }
  </ul>
</section>
